# .github/workflows/asan_ci.yml
#
# This workflow uses a Dockerfile to create a consistent environment
# for the ASAN build and test process.

name: Fork ASAN Build and Test (Docker)

on:
  push:
    branches-ignore:
      - 'main'
      - 'master'

jobs:
  asan-build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # - name: Initialize minimal CPU submodules
      #   # This step now runs on the host runner.
      #   run: |
      #     chmod +x .github/scripts/init_cpu_submodules.sh
      #     ./.github/scripts/init_cpu_submodules.sh

      - name: Set up Docker Buildx
        # This step sets up a builder instance that supports the GHA cache backend.
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and cache Docker image
        # This action builds the image and handles caching automatically
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.asan
          # We are not pushing to a registry, just loading into the local Docker daemon
          push: false
          load: true
          tags: pytorch-asan-build:latest
          # Configure caching to use the GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run ASAN Build and Test Script inside Docker
        # This step runs the build script inside the container we just built.
        # We mount the repository code into the container's workspace.
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            pytorch-asan-build \
            bash -c " \
              git config --global --add safe.directory '*' && \
              chmod +x .github/scripts/run_asan_build.sh && \
              ./.github/scripts/run_asan_build.sh"
