name: Fork Comprehensive Lint

on:
  push:
    branches-ignore:
      - 'main'
      - 'master'


permissions: read-all

jobs:
  build-lint-image:
    name: Build and cache lint container  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.lint
          push: false
          tags: pytorch-lint:latest
          # Configure caching to use the GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  get-changed-files:
    name: Get changed files
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **
          separator: ' '
          
      - name: Set output for all files
        run: |
          if [ "${{ steps.changed-files.outputs.all_changed_files }}" = "" ]; then
            echo "changed-files=*" >> $GITHUB_OUTPUT
          else
            echo "changed-files=${{ steps.changed-files.outputs.all_changed_files }}" >> $GITHUB_OUTPUT
          fi

  lintrunner-clang:
    name: lintrunner-clang
    runs-on: ubuntu-latest
    needs: [build-lint-image, get-changed-files]
    # Only run if there are changed files relevant to clangtidy / clangformat
    if: |
      needs.get-changed-files.outputs.changed-files == '*' ||
      contains(needs.get-changed-files.outputs.changed-files, '.h') ||
      contains(needs.get-changed-files.outputs.changed-files, '.cpp') ||
      contains(needs.get-changed-files.outputs.changed-files, '.cc') ||
      contains(needs.get-changed-files.outputs.changed-files, '.cxx') ||
      contains(needs.get-changed-files.outputs.changed-files, '.hpp') ||
      contains(needs.get-changed-files.outputs.changed-files, '.hxx') ||
      contains(needs.get-changed-files.outputs.changed-files, '.cu') ||
      contains(needs.get-changed-files.outputs.changed-files, '.cuh') ||
      contains(needs.get-changed-files.outputs.changed-files, '.mm') ||
      contains(needs.get-changed-files.outputs.changed-files, '.metal')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (from cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.lint
          load: true
          tags: pytorch-lint:latest
          cache-from: type=gha
          
      - name: Run lintrunner script in container
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed-files }}
          CLANG: "1"
        run: |
          # Run linting inside the Docker container
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CHANGED_FILES="$CHANGED_FILES" \
            -e CLANG="$CLANG" \
            pytorch-lint:latest \
            bash -c "
          # Mirror the exact logic from PyTorch's lintrunner.sh
          if [ "$CHANGED_FILES" = "*" ]; then
            export ADDITIONAL_LINTRUNNER_ARGS="--take CLANGTIDY,CLANGFORMAT --all-files"
          else
            export ADDITIONAL_LINTRUNNER_ARGS="--take CLANGTIDY,CLANGFORMAT $CHANGED_FILES"
          fi
          
          # Use uv to speed up lintrunner init
          python3 -m pip install -U uv==0.8.* setuptools
          
          CACHE_DIRECTORY=\"/tmp/.lintbin\"
          # Try to recover the cached binaries
          if [ -d \"\$CACHE_DIRECTORY\" ]; then
              cp -r \"\$CACHE_DIRECTORY\" . || true
          fi
          
          # This has already been cached in the docker image
          lintrunner init 2> /dev/null
          
          # Do build steps necessary for linters
          python3 -m tools.linter.clang_tidy.generate_build_files
          python3 -m tools.generate_torch_version --is_debug=false
          python3 -m tools.pyi.gen_pyi \
              --native-functions-path aten/src/ATen/native/native_functions.yaml \
              --tags-path aten/src/ATen/native/tags.yaml \
              --deprecated-functions-path "tools/autograd/deprecated.yaml"
          python3 torch/utils/data/datapipes/gen_pyi.py
          
          # Also check generated pyi files
          find torch -name '*.pyi' -exec git add --force -- "{}" +
          
          RC=0
          # Run lintrunner on all files
          if ! lintrunner --force-color --tee-json=lint.json ${ADDITIONAL_LINTRUNNER_ARGS} 2> /dev/null; then
              echo ""
              echo -e "\e[1m\e[36mYou can reproduce these results locally by using \`lintrunner -m origin/main\`. (If you don't get the same results, run \'lintrunner init\' to update your local linter)\e[0m"
              echo -e "\e[1m\e[36mSee https://github.com/pytorch/pytorch/wiki/lintrunner for setup instructions. To apply suggested patches automatically, use the -a flag. Before pushing another commit,\e[0m"
              echo -e "\e[1m\e[36mplease verify locally and ensure everything passes.\e[0m"
              RC=1
          fi
          
          # Unstage temporally added pyi files
          find torch -name '*.pyi' -exec git restore --staged -- "{}" +
          
          # Use jq to massage the JSON lint output into GitHub Actions workflow commands.
          jq --raw-output \
              '\"::\(if .severity == \"advice\" or .severity == \"disabled\" then \"warning\" else .severity end) file=\(.path),line=\(.line),col=\(.char),title=\(.code) \(.name)::\" + (.description | gsub(\"\\n\"; \"%0A\"))' \
              lint.json || true
          
          exit $RC
          "

  lintrunner-mypy:
    name: lintrunner-mypy
    runs-on: ubuntu-latest
    needs: [build-lint-image, get-changed-files]
    # Only run if there are changed files relevant to mypy
    if: |
      needs.get-changed-files.outputs.changed-files == '*' ||
      contains(needs.get-changed-files.outputs.changed-files, '.py') ||
      contains(needs.get-changed-files.outputs.changed-files, '.pyi')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (from cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.lint
          load: true
          tags: pytorch-lint:latest
          cache-from: type=gha
          
      - name: Run mypy linting in container
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed-files }}
        run: |
          # Run mypy inside the Docker container
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CHANGED_FILES="$CHANGED_FILES" \
            pytorch-lint:latest \
            bash -c "
          echo \"Running mypy\"
          
          # Use uv to speed up lintrunner init
          python3 -m pip install -U uv==0.8.* setuptools
          
          CACHE_DIRECTORY=\"/tmp/.lintbin\"
          if [ -d \"\$CACHE_DIRECTORY\" ]; then
              cp -r \"\$CACHE_DIRECTORY\" . || true
          fi
          
          lintrunner init 2> /dev/null
          
          python3 -m tools.generate_torch_version --is_debug=false
          python3 -m tools.pyi.gen_pyi \
              --native-functions-path aten/src/ATen/native/native_functions.yaml \
              --tags-path aten/src/ATen/native/tags.yaml \
              --deprecated-functions-path "tools/autograd/deprecated.yaml"
          python3 torch/utils/data/datapipes/gen_pyi.py
          
          find torch -name '*.pyi' -exec git add --force -- "{}" +
          
          RC=0
          if ! ADDITIONAL_LINTRUNNER_ARGS="--take MYPY,MYPYSTRICT --all-files" lintrunner --force-color --tee-json=lint.json ${ADDITIONAL_LINTRUNNER_ARGS} 2> /dev/null; then
              echo ""
              echo -e "\e[1m\e[36mYou can reproduce these results locally by using \`lintrunner -m origin/main\`.\e[0m"
              RC=1
          fi
          
          find torch -name '*.pyi' -exec git restore --staged -- "{}" +
          
          jq --raw-output \
              '\"::\(if .severity == \"advice\" or .severity == \"disabled\" then \"warning\" else .severity end) file=\(.path),line=\(.line),col=\(.char),title=\(.code) \(.name)::\" + (.description | gsub(\"\\n\"; \"%0A\"))' \
              lint.json || true
          
          exit $RC
          "

  lintrunner-noclang:
    name: lintrunner-noclang
    runs-on: ubuntu-latest
    needs: [build-lint-image, get-changed-files]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (from cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.lint
          load: true
          tags: pytorch-lint:latest
          cache-from: type=gha
          
      - name: Run all other linters in container
        env:
          CHANGED_FILES: ${{ needs.get-changed-files.outputs.changed-files }}
        run: |
          # Run linting inside the Docker container
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e CHANGED_FILES="$CHANGED_FILES" \
            pytorch-lint:latest \
            bash -c "
          echo \"Running all other linters\"
          
          # Use uv to speed up lintrunner init
          python3 -m pip install -U uv==0.8.* setuptools
          
          CACHE_DIRECTORY=\"/tmp/.lintbin\"
          if [ -d \"\$CACHE_DIRECTORY\" ]; then
              cp -r \"\$CACHE_DIRECTORY\" . || true
          fi
          
          lintrunner init 2> /dev/null
          
          python3 -m tools.generate_torch_version --is_debug=false
          python3 -m tools.pyi.gen_pyi \
              --native-functions-path aten/src/ATen/native/native_functions.yaml \
              --tags-path aten/src/ATen/native/tags.yaml \
              --deprecated-functions-path "tools/autograd/deprecated.yaml"
          python3 torch/utils/data/datapipes/gen_pyi.py
          
          find torch -name '*.pyi' -exec git add --force -- "{}" +
          
          RC=0
          if [ "$CHANGED_FILES" = '*' ]; then
            if ! ADDITIONAL_LINTRUNNER_ARGS="--skip CLANGTIDY,CLANGFORMAT,MYPY,MYPYSTRICT --all-files" lintrunner --force-color --tee-json=lint.json ${ADDITIONAL_LINTRUNNER_ARGS} 2> /dev/null; then
                RC=1
            fi
          else
            if ! ADDITIONAL_LINTRUNNER_ARGS="--skip CLANGTIDY,CLANGFORMAT,MYPY,MYPYSTRICT ${CHANGED_FILES}" lintrunner --force-color --tee-json=lint.json ${ADDITIONAL_LINTRUNNER_ARGS} 2> /dev/null; then
                RC=1
            fi
          fi
          
          if [ $RC -ne 0 ]; then
              echo ""
              echo -e "\e[1m\e[36mYou can reproduce these results locally by using \`lintrunner -m origin/main\`.\e[0m"
          fi
          
          find torch -name '*.pyi' -exec git restore --staged -- "{}" +
          
          jq --raw-output \
              '\"::\(if .severity == \"advice\" or .severity == \"disabled\" then \"warning\" else .severity end) file=\(.path),line=\(.line),col=\(.char),title=\(.code) \(.name)::\" + (.description | gsub(\"\\n\"; \"%0A\"))' \
              lint.json || true
          
          exit $RC
          "

  quick-checks:
    name: quick-checks
    runs-on: ubuntu-latest
    needs: build-lint-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (from cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.lint
          load: true
          tags: pytorch-lint:latest
          cache-from: type=gha
          
      - name: Run quick checks in container
        run: |
          # Run quick checks inside the Docker container
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            pytorch-lint:latest \
            bash -c '
          # Ensure no non-breaking spaces
          (! git --no-pager grep -In "$(printf '\''\xC2\xA0'\'')" -- . || (echo "The above lines have non-breaking spaces (U+00A0); please convert them to spaces (U+0020)"; false))

          # Ensure cross-OS compatible file names
          (! git ls-files | grep -E '\''([<>:"|?*]|[ .]$)'\'' || (echo "The above file names are not valid across all operating systems. Please ensure they don'\''t contain the characters '\''<>:\"|?*'\'' and don'\''t end with a white space or a '\''.'\'' "; false))

          # Ensure no versionless Python shebangs
          (! git --no-pager grep -In '\''#!.*python$'\'' -- . || (echo "The above lines have versionless Python shebangs; please specify either python2 or python3"; false))

          # C++ docs check
          pushd docs/cpp/source
          ./check-doxygen.sh
          popd

          # CUDA kernel launch check
          set -eux
          python3 torch/testing/_internal/check_kernel_launches.py |& tee cuda_kernel_launch_checks.txt
          '

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true